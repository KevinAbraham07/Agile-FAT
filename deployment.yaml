apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-donation-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: online-donation-system
  template:
    metadata:
      labels:
        app: online-donation-system
    spec:
      containers:
        - name: online-donation-system
          image: kevinabraham28/online-donation-system:latest
---
apiVersion: v1
kind: Service
metadata:
  name: online-donation-system-service
spec:
  selector:
    app: online-donation-system
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP